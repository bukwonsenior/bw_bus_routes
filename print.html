<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>셔틀버스 노선도 — 인쇄용 (A4 가로)</title>

<!-- ═══════════════════════════════════════════════════════════
     ▼ 카카오 JavaScript 키 (index.html 과 동일)
     ═══════════════════════════════════════════════════════════ -->
<script>
  const KAKAO_APP_KEY = "3e728a6e83cb38eec3d7a2321a5f0847";
</script>

<script src="route_data.js?v=259e7a37"></script>
<style>
  @page{size:A4 landscape;margin:6mm}

  *{box-sizing:border-box;margin:0;padding:0;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#dfe3e8;color:#000;
       overflow-x:auto}

  /* ── 화면 전용 조작 바 ── */
  .bar{position:sticky;top:0;left:0;z-index:99;background:#1f2937;color:#fff;padding:11px 18px;
       display:flex;align-items:center;gap:14px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bar b{font-size:14px;white-space:nowrap}
  .bar span{color:#cbd5e1;font-size:12px}
  .bar button{margin-left:auto;padding:9px 20px;font-family:inherit;font-size:14px;font-weight:800;
              background:#fbbf24;color:#111;border:none;border-radius:6px;cursor:pointer;white-space:nowrap}
  .bar button:hover{background:#f59e0b}

  /* ── A4 가로 1장 = 1코스 ── */
  .page{width:285mm;height:198mm;margin:16px auto;background:#fff;
        display:flex;flex-direction:column;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.22)}

  .ttl{flex:0 0 auto;display:flex;align-items:center;gap:10mm;padding:3.2mm 5mm;
       border-bottom:3.5px solid}
  .badge{flex:0 0 auto;padding:2mm 5.5mm;border-radius:2mm;color:#fff;font-size:18.5pt;
         font-weight:800;letter-spacing:-.5pt;line-height:1.1;white-space:nowrap}
  .ttl h1{font-size:22.5pt;font-weight:800;letter-spacing:-1pt;line-height:1.1}
  .ttl .sub{font-size:12pt;font-weight:700;color:#333;margin-top:.8mm}
  .ttl .run{margin-left:auto;text-align:right;font-size:15pt;font-weight:800;line-height:1.3;
            white-space:nowrap}
  .ttl .run em{display:block;font-style:normal;font-size:10.5pt;font-weight:600;color:#444}

  .body{flex:1 1 auto;display:flex;min-height:0}
  .mapbox{flex:0 0 134mm;border-right:2.5px solid #111;position:relative;background:#eef1f4}
  .mapbox .mp{position:absolute;inset:0}
  .tbl{flex:1 1 auto;min-width:0;min-height:0;padding:2mm 2.5mm;overflow:hidden}

  /* 세로 우선 2열 그리드 (열 넘침 없음) */
  .cols{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;
        column-gap:4mm;height:100%}

  .row{display:flex;align-items:center;gap:2mm;min-width:0;
       border-bottom:.5px solid #dadada;padding:0 1mm}
  .row .n{flex:0 0 6.4mm;height:6.4mm;border-radius:50%;color:#fff;font-size:9.5pt;font-weight:800;
          display:flex;align-items:center;justify-content:center;line-height:1}
  .row .s{flex:1 1 auto;min-width:0;font-size:12pt;font-weight:700;letter-spacing:-.75pt;
          line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .t{flex:0 0 auto;font-size:12pt;font-weight:800;font-variant-numeric:tabular-nums}
  .row.hub{background:#FFF3CD}
  .row.hub .s{font-weight:800}

  /* 정류장이 많은 코스(오후) 축소 */
  .dense .row .n{flex:0 0 5.7mm;height:5.7mm;font-size:8.5pt}
  .dense .row .s{font-size:10.5pt;letter-spacing:-.85pt}
  .dense .row .t{font-size:10.5pt}

  .foot{flex:0 0 auto;padding:1.8mm 5mm;border-top:2px solid #111;font-size:10pt;font-weight:700;
        display:flex;gap:8mm;color:#222}
  .foot .r{margin-left:auto;font-weight:600;color:#555}

  .warn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        text-align:center;padding:10mm;font-size:12pt;font-weight:700;color:#b91c1c;line-height:1.8;
        background:#fff7f7}

  @media print{
    .bar{display:none}
    body{background:#fff;overflow:visible}
    .page{margin:0;box-shadow:none;page-break-after:always;break-after:page}
    .page:last-child{page-break-after:auto;break-after:auto}
  }
</style>
</head>
<body>

<div class="bar">
  <b>셔틀버스 노선도 · 인쇄용</b>
  <span>A4 <b>가로</b> 3장 (코스별 1장) · 인쇄 설정에서 <b>배경 그래픽</b>을 켜주세요</span>
  <button onclick="window.print()">인쇄 / PDF 저장</button>
</div>

<div id="out"></div>

<script>
(function(){
  const out=document.getElementById('out');
  const keyOK = KAKAO_APP_KEY && KAKAO_APP_KEY.indexOf('여기에')!==0;

  ROUTE_DATA.routes.forEach((r,i)=>{
    const n=r.stops.length;
    const rowsPerCol=Math.ceil(n/2);              // 세로 우선 2열
    const dense = n>28 ? ' dense' : '';
    const t0=r.stops[0].time, t1=r.stops[n-1].time;

    const rows=r.stops.map(s=>
      '<div class="row'+(s.name==='복지관'?' hub':'')+'">'
      +'<span class="n" style="background:'+r.color+'">'+s.seq+'</span>'
      +'<span class="s">'+s.name+'</span>'
      +'<span class="t">'+s.time+'</span></div>').join('');

    out.insertAdjacentHTML('beforeend',
      '<div class="page">'
      +'<div class="ttl" style="border-bottom-color:'+r.color+'">'
        +'<div class="badge" style="background:'+r.color+'">'+r.name+'</div>'
        +'<div><h1>셔틀버스 운행 노선도</h1><div class="sub">'+r.sub+' · 북원노인종합복지관</div></div>'
        +'<div class="run" style="color:'+r.color+'">'+t0+' ~ '+t1
          +'<em>정차 '+n+'개소</em></div>'
      +'</div>'
      +'<div class="body">'
        +'<div class="mapbox" style="border-right-color:'+r.color+'"><div class="mp" id="mp'+i+'"></div></div>'
        +'<div class="tbl"><div class="cols'+dense+'" '
          +'style="grid-template-rows:repeat('+rowsPerCol+',1fr)">'+rows+'</div></div>'
      +'</div>'
      +'<div class="foot" style="border-top-color:'+r.color+'">'
        +'<span>문의 · 북원노인종합복지관</span>'
        +'<span>노란색 칸은 복지관(출발·도착)입니다</span>'
        +'<span class="r">도착시간은 교통상황에 따라 다소 달라질 수 있습니다</span></div>'
      +'</div>');
  });

  if(!keyOK){
    ROUTE_DATA.routes.forEach((r,i)=>{
      document.getElementById('mp'+i).innerHTML=
        '<div class="warn">지도를 표시하려면<br>이 파일 상단의 카카오 JavaScript 키를<br>입력해주세요.</div>';
    });
    return;
  }

  const sc=document.createElement('script');
  sc.src='//dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_APP_KEY+'&autoload=false';
  document.head.appendChild(sc);
  sc.onload=()=>kakao.maps.load(()=>{
    ROUTE_DATA.routes.forEach((r,i)=>{
      const el=document.getElementById('mp'+i);
      const map=new kakao.maps.Map(el,{center:new kakao.maps.LatLng(37.39,127.955),level:7});
      const path=r.stops.map(s=>new kakao.maps.LatLng(s.lat,s.lng));

      new kakao.maps.Polyline({map:map,path:path,strokeWeight:6,strokeColor:r.color,
        strokeOpacity:.9,strokeStyle:'solid',endArrow:true});

      r.stops.forEach((s,j)=>{
        const d=document.createElement('div');
        d.style.cssText='width:6.2mm;height:6.2mm;border-radius:50%;background:'+r.color
          +';color:#fff;font:800 9pt/6.2mm Malgun Gothic,sans-serif;text-align:center;'
          +'border:1.6px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.65)';
        d.textContent=s.seq;
        new kakao.maps.CustomOverlay({map:map,position:path[j],content:d,yAnchor:.5});
      });

      const b=new kakao.maps.LatLngBounds();
      path.forEach(p=>b.extend(p));
      const fit=()=>{ map.relayout(); map.setBounds(b,12,12,12,12); };
      fit(); setTimeout(fit,250);
    });
  });
})();
</script>
</body>
</html>
