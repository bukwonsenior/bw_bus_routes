<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>셔틀버스 노선도 — 인쇄용 (A4 세로)</title>

<!-- ═══════════════════════════════════════════════════════════
     ▼ 카카오 JavaScript 키 (index.html 과 동일)
     ═══════════════════════════════════════════════════════════ -->
<script>
  const KAKAO_APP_KEY = "3e728a6e83cb38eec3d7a2321a5f0847";
</script>

<script src="route_data.js?v=1634a993"></script>
<style>
  @page{size:A4 portrait;margin:6mm}

  *{box-sizing:border-box;margin:0;padding:0;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#dfe3e8;color:#000;
       overflow-x:auto}

  /* ── 화면 전용 조작 바 ── */
  .bar{position:sticky;top:0;left:0;z-index:99;background:#1f2937;color:#fff;padding:11px 18px;
       display:flex;align-items:center;gap:14px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bar b{font-size:14px;white-space:nowrap}
  .bar span{color:#cbd5e1;font-size:12px}
  .bar button{margin-left:auto;padding:9px 20px;font-family:inherit;font-size:14px;font-weight:800;
              background:#fbbf24;color:#111;border:none;border-radius:6px;cursor:pointer;white-space:nowrap}
  .bar button:hover{background:#f59e0b}

  /* ── A4 세로 1장 = 1코스 ── */
  .page{width:198mm;height:285mm;margin:16px auto;background:#fff;
        display:flex;flex-direction:column;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.22)}

  /* 머리글 */
  .ttl{flex:0 0 auto;display:flex;align-items:center;gap:5mm;padding:2.8mm 4mm;
       border-bottom:3px solid}
  .badge{flex:0 0 auto;padding:1.8mm 4mm;border-radius:1.8mm;color:#fff;font-size:15pt;
         font-weight:800;letter-spacing:-.6pt;line-height:1.1;white-space:nowrap}
  .ttl h1{font-size:19pt;font-weight:800;letter-spacing:-1.1pt;line-height:1.1}
  .ttl .sub{font-size:10pt;font-weight:700;color:#333;margin-top:.7mm;letter-spacing:-.4pt}
  .ttl .run{margin-left:auto;text-align:right;font-size:13.5pt;font-weight:800;line-height:1.25;
            white-space:nowrap}
  .ttl .run em{display:block;font-style:normal;font-size:9.5pt;font-weight:600;color:#444}

  /* 지도 — 남은 공간을 전부 차지 */
  .mapbox{flex:1 1 auto;min-height:0;position:relative;background:#eef1f4;
          border-bottom:2.5px solid}
  .mapbox .mp{position:absolute;inset:0}

  /* 정류장 표 — 필요한 높이만 */
  .tbl{flex:0 0 auto;padding:1.8mm 2mm}
  .cols{display:grid;grid-auto-flow:column;column-gap:3mm}

  .row{display:flex;align-items:center;gap:1.6mm;min-width:0;
       border-bottom:.5px solid #dcdcdc;padding:0 .8mm}
  .row .n{flex:0 0 6mm;height:6mm;border-radius:50%;color:#fff;font-size:9pt;font-weight:800;
          display:flex;align-items:center;justify-content:center;line-height:1}
  .row .s{flex:1 1 auto;min-width:0;font-size:11pt;font-weight:700;letter-spacing:-.8pt;
          line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .t{flex:0 0 auto;font-size:11pt;font-weight:800;font-variant-numeric:tabular-nums}
  .row.hub{background:#FFF3CD}

  .dense .row .n{flex:0 0 5.4mm;height:5.4mm;font-size:8pt}
  .dense .row .s{font-size:10pt;letter-spacing:-.9pt}
  .dense .row .t{font-size:10pt}

  .foot{flex:0 0 auto;padding:1.6mm 4mm;border-top:2px solid;font-size:9pt;font-weight:700;
        display:flex;gap:5mm;color:#222}
  .foot .r{margin-left:auto;font-weight:600;color:#555}

  .warn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        text-align:center;padding:10mm;font-size:12pt;font-weight:700;color:#b91c1c;line-height:1.8;
        background:#fff7f7}

  @media print{
    .bar{display:none}
    body{background:#fff;overflow:visible}
    .page{margin:0;box-shadow:none;page-break-after:always;break-after:page}
    .page:last-child{page-break-after:auto;break-after:auto}
  }
</style>
</head>
<body>

<div class="bar">
  <b>셔틀버스 노선도 · 인쇄용</b>
  <span>A4 <b>세로</b> 3장 (코스별 1장) · 인쇄 설정에서 <b>배경 그래픽</b>을 켜주세요</span>
  <button onclick="window.print()">인쇄 / PDF 저장</button>
</div>

<div id="out"></div>

<script>
(function(){
  const out=document.getElementById('out');
  const keyOK = KAKAO_APP_KEY && KAKAO_APP_KEY.indexOf('여기에')!==0;

  ROUTE_DATA.routes.forEach((r,i)=>{
    const n=r.stops.length;
    const cols = n<=18 ? 2 : 3;                    // 정류장 수에 따라 열 수
    const rowsPerCol = Math.ceil(n/cols);
    const dense = n>28;
    const rowH = dense ? 6.6 : 7.4;                // mm
    const tblH = (rowsPerCol*rowH + 3.6).toFixed(1);
    const t0=r.stops[0].time, t1=r.stops[n-1].time;

    const rows=r.stops.map(s=>
      '<div class="row'+(s.name==='복지관'?' hub':'')+'" style="height:'+rowH+'mm">'
      +'<span class="n" style="background:'+r.color+'">'+s.seq+'</span>'
      +'<span class="s">'+s.name+'</span>'
      +'<span class="t">'+s.time+'</span></div>').join('');

    out.insertAdjacentHTML('beforeend',
      '<div class="page">'
      +'<div class="ttl" style="border-bottom-color:'+r.color+'">'
        +'<div class="badge" style="background:'+r.color+'">'+r.name+'</div>'
        +'<div><h1>셔틀버스 운행 노선도</h1>'
          +'<div class="sub">'+r.sub+' · 북원노인종합복지관</div></div>'
        +'<div class="run" style="color:'+r.color+'">'+t0+' ~ '+t1
          +'<em>정차 '+n+'개소</em></div>'
      +'</div>'
      +'<div class="mapbox" style="border-bottom-color:'+r.color+'"><div class="mp" id="mp'+i+'"></div></div>'
      +'<div class="tbl" style="height:'+tblH+'mm">'
        +'<div class="cols'+(dense?' dense':'')+'" style="grid-template-columns:repeat('+cols+',1fr);'
        +'grid-template-rows:repeat('+rowsPerCol+','+rowH+'mm)">'+rows+'</div></div>'
      +'<div class="foot" style="border-top-color:'+r.color+'">'
        +'<span>문의 · 북원노인종합복지관</span>'
        +'<span>노란색 칸은 복지관(출발·도착)</span>'
        +'<span class="r">도착시간은 교통상황에 따라 다소 달라질 수 있습니다</span></div>'
      +'</div>');
  });

  if(!keyOK){
    ROUTE_DATA.routes.forEach((r,i)=>{
      document.getElementById('mp'+i).innerHTML=
        '<div class="warn">지도를 표시하려면<br>이 파일 상단의 카카오 JavaScript 키를<br>입력해주세요.</div>';
    });
    return;
  }

  const sc=document.createElement('script');
  sc.src='//dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_APP_KEY+'&autoload=false';
  document.head.appendChild(sc);
  sc.onload=()=>kakao.maps.load(()=>{
    ROUTE_DATA.routes.forEach((r,i)=>{
      const el=document.getElementById('mp'+i);
      const map=new kakao.maps.Map(el,{center:new kakao.maps.LatLng(37.39,127.955),level:7});
      const path=r.stops.map(s=>new kakao.maps.LatLng(s.lat,s.lng));

      new kakao.maps.Polyline({map:map,path:path,strokeWeight:5.5,strokeColor:r.color,
        strokeOpacity:.9,strokeStyle:'solid',endArrow:true});

      const bounds=new kakao.maps.LatLngBounds();
      path.forEach(p=>bounds.extend(p));

      let marks=[];
      // 번호 마커 배치 (겹침 자동 회피)
      function place(){
        marks.forEach(m=>m.setMap(null)); marks=[];
        const proj=map.getProjection();
        const pts=path.map(p=>{const c=proj.containerPointFromCoords(p);return {x:c.x,y:c.y}});

        const MIN=25;                       // 마커 최소 간격(px)
        for(let it=0; it<80; it++){
          let moved=false;
          for(let a=0;a<pts.length;a++) for(let b=a+1;b<pts.length;b++){
            let dx=pts[b].x-pts[a].x, dy=pts[b].y-pts[a].y;
            let d=Math.sqrt(dx*dx+dy*dy);
            if(d===0){ pts[a].x-=MIN/2; pts[b].x+=MIN/2; moved=true; continue; }
            if(d<MIN){
              const push=(MIN-d)/2; dx/=d; dy/=d;
              pts[a].x-=dx*push; pts[a].y-=dy*push;
              pts[b].x+=dx*push; pts[b].y+=dy*push;
              moved=true;
            }
          }
          if(!moved) break;
        }

        r.stops.forEach((s,j)=>{
          const d=document.createElement('div');
          d.style.cssText='width:6mm;height:6mm;border-radius:50%;background:'+r.color
            +';color:#fff;font:800 8.5pt/6mm Malgun Gothic,sans-serif;text-align:center;'
            +'border:1.5px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.7)';
          d.textContent=s.seq;
          const pos=proj.coordsFromContainerPoint(new kakao.maps.Point(pts[j].x,pts[j].y));
          marks.push(new kakao.maps.CustomOverlay({map:map,position:pos,content:d,yAnchor:.5,zIndex:3}));
        });
      }

      const fit=()=>{ map.relayout(); map.setBounds(bounds,10,10,10,10); setTimeout(place,60); };
      fit(); setTimeout(fit,300); setTimeout(fit,900);
    });
  });
})();
</script>
</body>
</html>
